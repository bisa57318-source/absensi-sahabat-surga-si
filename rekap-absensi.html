<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Rekap Absensi - Absensi Sahabat Surga
    </title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .rekap-page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .rekap-card {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: #fffdf8;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .rekap-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .rekap-header h1 {
            margin: 15px 0 8px;
            color: #176b3a;
        }

        .rekap-header p {
            margin: 0;
            color: #777;
        }

        .rekap-toolbar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .rekap-toolbar input,
        .rekap-toolbar select {
            flex: 1;
            min-width: 200px;
            padding: 13px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: Poppins, sans-serif;
            background: white;
        }

        .rekap-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-box {
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            background: #f8f5ec;
        }

        .summary-box h3 {
            margin: 0 0 8px;
            color: #555;
        }

        .summary-box strong {
            font-size: 28px;
            color: #176b3a;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .rekap-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .rekap-table th {
            background: #176b3a;
            color: white;
            padding: 14px;
            text-align: left;
            white-space: nowrap;
        }

        .rekap-table td {
            padding: 13px 14px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        .rekap-table tbody tr:hover {
            background: #faf8f1;
        }

        .badge-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-hadir {
            background: #dff4e7;
            color: #176b3a;
        }

        .badge-sakit {
            background: #fff0cc;
            color: #9a7412;
        }

        .badge-izin {
            background: #e8e8e8;
            color: #555;
        }

        .btn-kembali-rekap {
            display: block;
            margin: 30px auto 0;
            padding: 12px 25px;
            border: 1px solid #176b3a;
            border-radius: 12px;
            background: white;
            color: #176b3a;
            font-family: Poppins, sans-serif;
            cursor: pointer;
        }

        .btn-kembali-rekap:hover {
            background: #176b3a;
            color: white;
        }

        @media (max-width: 700px) {

            .rekap-card {
                padding: 20px;
            }

            .rekap-summary {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <div class="rekap-page">

        <div class="rekap-card">


            <div class="book-animation"></div>


            <div class="rekap-header">

                <h1>
                    Rekap Absensi
                </h1>

                <p>
                    Pusat Rekapitulasi Absensi Mahasiswa
                </p>

            </div>


            <div class="rekap-toolbar">

                <input
                    type="date"
                    id="filterTanggal">

                <select id="filterStatus">

                    <option value="">
                        Semua Status
                    </option>

                    <option value="Hadir">
                        Hadir
                    </option>

                    <option value="Sakit">
                        Sakit
                    </option>

                    <option value="Izin">
                        Izin
                    </option>

                </select>


                <input
                    type="text"
                    id="inputPencarianAbsensi"
                    placeholder="Cari NIM atau nama mahasiswa...">
<button
    type="button"
    class="btn-pdf-rekap"
    onclick="exportExcel()">

    📊 Export Rekap Excel

</button>
                    
            </div>


            <div class="rekap-summary">

                <div class="summary-box">

                    <h3>
                        Hadir
                    </h3>

                    <strong id="jumlahHadir">
                        0
                    </strong>

                </div>


                <div class="summary-box">

                    <h3>
                        Sakit
                    </h3>

                    <strong id="jumlahSakit">
                        0
                    </strong>

                </div>


                <div class="summary-box">

                    <h3>
                        Izin
                    </h3>

                    <strong id="jumlahIzin">
                        0
                    </strong>

                </div>

            </div>


            <div class="table-wrapper">

                <table class="rekap-table">

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                Tanggal
                            </th>

                            <th>
                                Jam
                            </th>

                            <th>
                                NIM
                            </th>

                            <th>
                                Nama
                            </th>

                            <th>
                                Kelas
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Keterangan
                            </th>

                            <th>
                                Jarak
                            </th>

                            <th>
                                Wajah
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tabelRekapAbsensi">

                        <tr>

                            <td
                                colspan="10"
                                style="
                                    text-align:center;
                                    padding:35px;
                                ">

                                Data absensi akan dimuat...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <button
                class="btn-kembali-rekap"
                onclick="window.location.href='admin.html'">

                ← Kembali ke Dashboard Admin

            </button>


        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="rekap-absensi.js"></script>

</body>

</html>
